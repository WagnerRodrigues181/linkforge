services:
  postgres:
    image: postgres:16-alpine
    container_name: linkforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkforge
      POSTGRES_PASSWORD: linkforge
      POSTGRES_DB: linkforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: linkforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
